<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.08" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatUp {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes floatDown {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .floating-pill-1 {
      animation: floatUp 6s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: floatDown 7s ease-in-out infinite;
      animation-delay: -2s;
    }
    .floating-pill-3 {
      animation: floatUp 8s ease-in-out infinite;
      animation-delay: -3.5s;
    }
    .pulse-element {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .flow-path {
      stroke-dasharray: 20, 10;
      animation: flowLine 15s linear infinite;
    }
  </style>

  <!-- Deep canvas background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="180" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulse-element" />
  <circle cx="1020" cy="280" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)" class="pulse-element" />
  <circle cx="600" cy="340" r="110" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Animated flow lines in background -->
  <g fill="none" opacity="0.35">
    <path d="M-50,80 C300,30 450,150 750,90 C950,50 1100,120 1250,90" stroke="#38bdf8" stroke-width="2" class="flow-path" />
    <path d="M-50,290 C250,220 500,330 800,270 C1000,230 1150,310 1250,280" stroke="#c084fc" stroke-width="2" class="flow-path" style="animation-direction: reverse;" />
  </g>

  <!-- Dynamic Pill 1 (Top Left) -->
  <g class="floating-pill-1" transform="translate(60, 45)">
    <rect width="190" height="42" rx="21" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🎯 RLHF &amp; Preference</text>
  </g>

  <!-- Dynamic Pill 2 (Top Right) -->
  <g class="floating-pill-2" transform="translate(940, 45)">
    <rect width="200" height="42" rx="21" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <circle cx="22" cy="21" r="5" fill="#818cf8" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">👥 Workforce Scale</text>
  </g>

  <!-- Dynamic Pill 3 (Bottom Left) -->
  <g class="floating-pill-3" transform="translate(70, 275)">
    <rect width="190" height="42" rx="21" fill="url(#pillGrad3)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <circle cx="22" cy="21" r="5" fill="#c084fc" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ SFT &amp; Alignment</text>
  </g>

  <!-- Dynamic Pill 4 (Bottom Right) -->
  <g class="floating-pill-1" transform="translate(950, 275)">
    <rect width="180" height="42" rx="21" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔬 Multimodal QA</text>
  </g>

  <!-- Dynamic Mini Stat Badge (Center Top) -->
  <g transform="translate(485, 30)">
    <rect width="230" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitle (Always in front, fully legible) -->
  <!-- Title Badge / Glow backing -->
  <rect x="250" y="75" width="700" height="150" fill="transparent" pointer-events="none" />

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
    Awesome Human Data Labelling
  </text>
  
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Human Data Labelling
  </text>

  <!-- Subtitle -->
  <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Enterprise SaaS Platforms &amp; Open-Source Annotation Infrastructure
  </text>

  <!-- Focus Tags Sub-bar -->
  <text x="600" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#38bdf8">
    Expert Annotation • RLHF Preference Data • Multimodal SFT • Autonomous Model Alignment
  </text>

  <!-- Bottom Mini Decorative Dots / Pipeline -->
  <g transform="translate(450, 248)" opacity="0.8">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#334155" stroke-width="2" />
    <circle cx="30" cy="0" r="5" fill="#38bdf8" />
    <circle cx="105" cy="0" r="5" fill="#818cf8" />
    <circle cx="195" cy="0" r="5" fill="#a855f7" />
    <circle cx="270" cy="0" r="5" fill="#ec4899" />
  </g>
</svg>
